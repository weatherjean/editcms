# Nginx configuration for _edit CMS
#
# USAGE:
# 1. Set your server root to your site directory (containing _edit/ folder)
# 2. Include this file in your server block:
#    include /var/www/yoursite/_edit/nginx.conf;
# 3. Adjust $cms_root and $php_fpm variables below to match your setup
#
# Example server block:
# server {
#     listen 80;
#     server_name example.com;
#     root /var/www/yoursite;
#     include /var/www/yoursite/_edit/nginx.conf;
# }

# Variables - adjust these for your environment
set $cms_root $document_root/_edit;
set $php_fpm unix:/var/run/php/php-fpm.sock;  # Common paths: unix:/var/run/php/php8.1-fpm.sock or 127.0.0.1:9000

# Protect sensitive directories
location ~ /_edit/(database|config|core)/ {
    deny all;
    return 403;
}

# Protect sensitive file types
location ~ /_edit/.*\.(sqlite|txt|log|env)$ {
    deny all;
    return 403;
}

# API routes - route to api/index.php
location ~ ^/_edit/api(/.*)?$ {
    fastcgi_pass $php_fpm;
    fastcgi_index index.php;
    fastcgi_param SCRIPT_FILENAME $cms_root/api/index.php;
    fastcgi_param REQUEST_URI $uri;
    include fastcgi_params;
}

# Admin routes - SPA fallback to index.html
location /_edit/admin {
    alias $cms_root/admin-dist;
    try_files $uri $uri/ /admin-dist/index.html;
    index index.html;
}

# Uploads directory - serve static files
location /_edit/uploads {
    alias $cms_root/uploads;
    try_files $uri =404;
}

# Security headers
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-XSS-Protection "1; mode=block" always;
