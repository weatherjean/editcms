# Include inside a server whose root contains _edit/. Adjust the FPM socket.
# The enclosing ^~ prefix takes priority over the site's generic PHP handlers.
set $php_fpm unix:/var/run/php/php-fpm.sock;
location = /_edit { return 302 /_edit/admin/; }
location = /_edit/ { return 302 /_edit/admin/; }
location ^~ /_edit/ {
    autoindex off;
    disable_symlinks on;
    add_header X-Content-Type-Options nosniff always;

    location ~ /\. { return 404; }
    location ~ ^/_edit/(api|admin-api)(/|$) {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/_edit/$1/index.php;
        fastcgi_pass $php_fpm;
    }
    location /_edit/uploads/ {
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "sandbox; default-src 'none'" always;
        location ~ "^/_edit/uploads/(?:[0-9]{4}/[0-9]{2}/)?[^/.]+\.(?:jpg|jpeg|png|gif|webp|pdf|doc|docx|xls|xlsx|mp4|webm|ogg|oga|mp3|wav)$" {
            try_files $uri =404;
        }
        try_files /__edit_no_upload__ =404;
    }
    location /_edit/admin/ {
        location ~ \.(?:html|js|css|json|txt|md|svg|png|jpg|ico|woff|woff2)$ {
            try_files $uri =404;
        }
        location ~ \.[^/]+$ { return 404; }
        try_files $uri /_edit/admin/index.html;
    }
    # Private data, config, source, core, and all other paths stay inaccessible.
    location /_edit/ { return 404; }
}
