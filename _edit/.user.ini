; PHP Configuration for _edit CMS
; This file works on most shared hosting providers (cPanel, Plesk, etc.)
; For development, these can also be set in php.ini

; Maximum file upload size (must be <= post_max_size)
upload_max_filesize = 50M

; Maximum POST data size (must be >= upload_max_filesize)
post_max_size = 50M

; Maximum memory a script may consume
memory_limit = 256M

; Maximum execution time for a script (in seconds)
; Increase for slower connections or larger files
max_execution_time = 300

; Maximum time to parse input data (file uploads)
max_input_time = 300
