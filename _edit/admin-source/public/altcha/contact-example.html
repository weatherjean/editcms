<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact us</title>
  <script type="module" src="./contact-example.js"></script>
  <style>
    body { font: 1rem/1.5 system-ui, sans-serif; max-width: 36rem; margin: 3rem auto; padding: 0 1rem; }
    label { display: block; margin: 1rem 0; }
    input, textarea, button { font: inherit; padding: .6rem; box-sizing: border-box; }
    input, textarea { display: block; width: 100%; }
    button { margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>Contact us</h1>
  <form id="contact-form">
    <label>Your name <input name="from_name" maxlength="120" required autocomplete="name"></label>
    <label>Your email <input name="reply_to" type="email" maxlength="254" required autocomplete="email"></label>
    <label>Subject <input name="subject" maxlength="200" required></label>
    <label>Message <textarea name="message" rows="6" maxlength="10000" required></textarea></label>
    <altcha-widget challenge="/_edit/api/captcha" name="altcha"></altcha-widget>
    <button type="submit" disabled>Send message</button>
    <p id="status" role="status" aria-live="polite"></p>
  </form>
  <noscript>Please enable JavaScript to use this contact form.</noscript>
</body>
</html>
