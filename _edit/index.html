<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>_edit CMS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 48px;
            max-width: 600px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            font-size: 48px;
            margin-bottom: 16px;
            color: #1a202c;
        }
        p {
            color: #4a5568;
            margin-bottom: 32px;
            font-size: 18px;
            line-height: 1.6;
        }
        .links {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }
        a {
            display: inline-block;
            padding: 14px 28px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.2s;
        }
        a:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        a.secondary {
            background: #e2e8f0;
            color: #4a5568;
        }
        a.secondary:hover {
            background: #cbd5e0;
        }
        .api-docs {
            margin-top: 32px;
            padding-top: 32px;
            border-top: 1px solid #e2e8f0;
        }
        .api-docs h2 {
            font-size: 20px;
            margin-bottom: 12px;
            color: #2d3748;
        }
        .api-docs code {
            background: #f7fafc;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 14px;
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>_edit CMS</h1>
        <p>Lightweight headless CMS for shared hosting</p>

        <div class="links">
            <a href="/admin/">Admin Interface</a>
            <a href="/api/health" class="secondary">API Health</a>
        </div>

        <div class="api-docs">
            <h2>API Endpoints</h2>
            <p style="font-size: 16px; margin-bottom: 16px;">
                <strong>Admin API:</strong> <code>/admin-api/*</code> (requires authentication)<br>
                <strong>Public API:</strong> <code>/api/*</code> (public access)
            </p>
        </div>
    </div>
</body>
</html>
